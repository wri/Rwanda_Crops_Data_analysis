<script>
/**
 * Offline interactive SVG maps (GADM boundaries + GPS points).
 * Pan / zoom / hover / district filter — no tiles, no CDN.
 */
function initInteractiveMaps(MAP) {
  if (!MAP || !MAP.available || !MAP.panels || !MAP.panels.length) return;
  const COLORS = MAP.colors || {};
  const GEO = MAP.geo || {};
  const POINTS = MAP.points || [];
  const MASK = '#c9c3b8';
  const MASK_STROKE = '#a8a297';

  // Shared focus: clicking a district greys the others on every map.
  let sharedSelected = null;
  const redrawers = [];

  function setSharedSelected(name) {
    sharedSelected = sharedSelected === name ? null : name;
    redrawers.forEach(fn => fn());
  }

  function boundsOf(features) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    features.forEach(f => (f.rings || []).forEach(ring => ring.forEach(([x, y]) => {
      if (x < minX) minX = x; if (y < minY) minY = y;
      if (x > maxX) maxX = x; if (y > maxY) maxY = y;
    })));
    if (!isFinite(minX)) return { minX: 28.8, minY: -2.9, maxX: 30.9, maxY: -1.0 };
    return { minX, minY, maxX, maxY };
  }

  function makeProjector(b, width, height, pad) {
    pad = pad == null ? 18 : pad;
    const dx = Math.max(b.maxX - b.minX, 1e-6);
    const dy = Math.max(b.maxY - b.minY, 1e-6);
    const sx = (width - 2 * pad) / dx;
    const sy = (height - 2 * pad) / dy;
    const s = Math.min(sx, sy);
    const ox = (width - s * dx) / 2;
    const oy = (height - s * dy) / 2;
    return {
      xy(lon, lat) {
        return [ox + (lon - b.minX) * s, height - (oy + (lat - b.minY) * s)];
      },
      path(rings) {
        return rings.map(ring => {
          return ring.map((pt, i) => {
            const [x, y] = this.xy(pt[0], pt[1]);
            return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
          }).join(' ') + ' Z';
        }).join(' ');
      }
    };
  }

  function colorFor(pt, mode, selected) {
    if (selected && pt.district !== selected) return MASK;
    if (mode === 'land') return (COLORS.land || {})[pt.land] || COLORS.other || '#888';
    if (mode === 'weak') return pt.weak ? (COLORS.weak || '#a65b3a') : (COLORS.other || '#b7b1a6');
    if (mode === 'dup') return pt.dup ? (COLORS.dup || '#8a4545') : (COLORS.other || '#b7b1a6');
    if (mode === 'outside') return pt.outside ? (COLORS.outside || '#9b2c2c') : (COLORS.other || '#b7b1a6');
    if (mode === 'count') return (COLORS.district || {})[pt.district] || COLORS.other || '#888';
    return (COLORS.district || {})[pt.district] || COLORS.other || '#888';
  }

  function fillForDistrict(name, mode, panel, selected) {
    if (selected && selected !== name) return MASK;
    if (mode === 'count') {
      const counts = panel.counts || {};
      const vals = Object.values(counts);
      const vmax = Math.max(1, ...vals);
      const v = counts[name] || 0;
      const t = v / vmax;
      const r = Math.round(220 - 120 * t);
      const g = Math.round(232 - 80 * t);
      const b = Math.round(226 - 100 * t);
      return `rgb(${r},${g},${b})`;
    }
    if (mode === 'land') return COLORS.west_fill || '#c5d9ce';
    return (COLORS.district || {})[name] || (COLORS.west_fill || '#c5d9ce');
  }

  function tipHtml(pt) {
    return `<strong>${pt.district}</strong><br>` +
      `${pt.land}<br>` +
      `${pt.lat.toFixed(5)}, ${pt.lon.toFixed(5)}<br>` +
      `Altitude ${pt.alt == null ? '—' : pt.alt + ' m'} · Precision ${pt.prec == null ? '—' : pt.prec + ' m'}` +
      (pt.weak ? '<br><em>Weak GPS fix</em>' : '') +
      (pt.dup ? '<br><em>Shared coordinate</em>' : '') +
      (pt.outside ? '<br><em>Outside Rwanda land</em>' : '');
  }

  function legendSpec(mode) {
    const titles = {
      district: 'District',
      land: 'Land use',
      weak: 'GPS quality',
      dup: 'Shared GPS',
      outside: 'Location check',
      count: 'Sample size'
    };
    let items = [];
    if (mode === 'district') {
      const dist = COLORS.district || {};
      items = Object.keys(dist).sort().map(name => ({ label: name, color: dist[name] }));
    } else if (mode === 'land') {
      const land = COLORS.land || {};
      items = Object.keys(land).map(name => ({ label: name, color: land[name] }));
    } else if (mode === 'weak') {
      items = [
        { label: 'Weak GPS (altitude 0 m or precision > 50 m)', color: COLORS.weak || '#a65b3a' },
        { label: 'Other plots', color: COLORS.other || '#b7b1a6' }
      ];
    } else if (mode === 'dup') {
      items = [
        { label: 'Shared coordinate', color: COLORS.dup || '#8a4545' },
        { label: 'Unique coordinate', color: COLORS.other || '#b7b1a6' }
      ];
    } else if (mode === 'outside') {
      items = [
        { label: 'Outside Rwanda land', color: COLORS.outside || '#9b2c2c' },
        { label: 'Inside Rwanda', color: COLORS.other || '#b7b1a6' }
      ];
    } else if (mode === 'count') {
      items = [
        { label: 'Fewer interviews', color: 'rgb(220,232,226)' },
        { label: 'More interviews', color: 'rgb(100,152,126)' }
      ];
    }
    if (sharedSelected) {
      items = items.concat([{ label: 'Other districts (greyed)', color: MASK }]);
    }
    return { title: titles[mode] || 'Legend', items: items };
  }

  function renderLegend(el, mode) {
    const spec = legendSpec(mode);
    el.innerHTML = `<div class="leg-title">${spec.title}</div>` +
      spec.items.map(it =>
        `<span class="leg-item"><span class="swatch" style="background:${it.color}"></span>${it.label}</span>`
      ).join('');
  }

  document.querySelectorAll('[data-imap]').forEach(host => {
    const panelId = host.getAttribute('data-imap');
    const panel = MAP.panels.find(p => p.id === panelId);
    if (!panel) return;

    let mode = panel.mode || 'district';
    let width = 720, height = panel.scope === 'national' ? 720 : 640;

    const toolbar = document.createElement('div');
    toolbar.className = 'imap-toolbar';
    const layers = panel.layers || [mode];
    const layerLabels = {
      district: 'By district',
      land: 'By land use',
      weak: 'Weak GPS',
      dup: 'Shared GPS',
      outside: 'Outside Rwanda',
      count: 'Sample size'
    };
    layers.forEach(l => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'imap-btn' + (l === mode ? ' active' : '');
      btn.textContent = layerLabels[l] || l;
      btn.addEventListener('click', () => {
        mode = l;
        toolbar.querySelectorAll('.imap-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderLegend(legend, mode);
        draw();
      });
      toolbar.appendChild(btn);
    });
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'imap-btn';
    reset.textContent = 'Reset view';
    reset.addEventListener('click', () => {
      sharedSelected = null;
      redrawers.forEach(fn => fn(true));
    });
    toolbar.appendChild(reset);

    const stage = document.createElement('div');
    stage.className = 'imap-stage';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('width', '100%');
    svg.style.maxWidth = '760px';
    svg.style.background = '#fffcf7';
    svg.style.display = 'block';
    svg.style.borderRadius = '6px';
    svg.style.cursor = 'grab';
    const tip = document.createElement('div');
    tip.className = 'imap-tip';
    tip.style.display = 'none';
    const status = document.createElement('div');
    status.className = 'imap-status';
    const legend = document.createElement('div');
    legend.className = 'imap-legend';

    host.innerHTML = '';
    host.appendChild(toolbar);
    stage.appendChild(svg);
    stage.appendChild(tip);
    host.appendChild(stage);
    host.appendChild(legend);
    host.appendChild(status);
    renderLegend(legend, mode);

    let vb = { x: 0, y: 0, w: width, h: height };
    function applyVb() {
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    }
    function resetVb() { vb = { x: 0, y: 0, w: width, h: height }; applyVb(); }

    let dragging = false, last = null;
    svg.addEventListener('pointerdown', e => {
      dragging = true; last = { x: e.clientX, y: e.clientY };
      svg.setPointerCapture(e.pointerId);
      svg.style.cursor = 'grabbing';
    });
    svg.addEventListener('pointermove', e => {
      if (!dragging || !last) return;
      const rect = svg.getBoundingClientRect();
      const dx = (e.clientX - last.x) * (vb.w / rect.width);
      const dy = (e.clientY - last.y) * (vb.h / rect.height);
      vb.x -= dx; vb.y -= dy;
      last = { x: e.clientX, y: e.clientY };
      applyVb();
    });
    svg.addEventListener('pointerup', () => { dragging = false; last = null; svg.style.cursor = 'grab'; });
    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const mx = vb.x + (e.clientX - rect.left) * (vb.w / rect.width);
      const my = vb.y + (e.clientY - rect.top) * (vb.h / rect.height);
      const factor = e.deltaY < 0 ? 0.85 : 1.18;
      const nw = Math.min(width * 3, Math.max(width * 0.15, vb.w * factor));
      const nh = nw * (height / width);
      vb.x = mx - (mx - vb.x) * (nw / vb.w);
      vb.y = my - (my - vb.y) * (nh / vb.h);
      vb.w = nw; vb.h = nh;
      applyVb();
    }, { passive: false });

    function draw(doReset) {
      if (doReset) resetVb();
      const selected = sharedSelected;
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      const districts = GEO.districts || [];
      const provinces = GEO.provinces || [];
      const feats = panel.scope === 'national' ? provinces : districts;
      const b = boundsOf(feats);
      // Expand view to include survey points (needed for GPS outside Rwanda).
      POINTS.forEach(pt => {
        if (pt.lon < b.minX) b.minX = pt.lon;
        if (pt.lon > b.maxX) b.maxX = pt.lon;
        if (pt.lat < b.minY) b.minY = pt.lat;
        if (pt.lat > b.maxY) b.maxY = pt.lat;
      });
      const padB = {
        minX: b.minX - 0.05, maxX: b.maxX + 0.05,
        minY: b.minY - 0.05, maxY: b.maxY + 0.05
      };
      const proj = makeProjector(padB, width, height, 22);

      const gPoly = document.createElementNS(svg.namespaceURI, 'g');
      const gPts = document.createElementNS(svg.namespaceURI, 'g');
      const gLab = document.createElementNS(svg.namespaceURI, 'g');

      if (panel.scope === 'national') {
        provinces.forEach(f => {
          const path = document.createElementNS(svg.namespaceURI, 'path');
          path.setAttribute('d', proj.path(f.rings));
          const isWest = f.name === 'Iburengerazuba' || f.label === 'Western';
          path.setAttribute('fill', isWest ? (COLORS.west_fill || '#c5d9ce') : (COLORS.other_province || '#e8e2d6'));
          path.setAttribute('stroke', isWest ? '#4d7363' : '#b5aea3');
          path.setAttribute('stroke-width', isWest ? 1.4 : 0.7);
          path.setAttribute('fill-opacity', selected ? (isWest ? '0.55' : '0.35') : '0.95');
          gPoly.appendChild(path);
          const [cx, cy] = proj.xy(f.centroid[0], f.centroid[1]);
          const t = document.createElementNS(svg.namespaceURI, 'text');
          t.setAttribute('x', cx); t.setAttribute('y', cy);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'middle');
          t.setAttribute('font-size', '11');
          t.setAttribute('fill', selected && !isWest ? MASK_STROKE : '#3e3a35');
          t.setAttribute('fill-opacity', selected && !isWest ? '0.45' : '1');
          t.setAttribute('font-family', 'Segoe UI, Helvetica Neue, Arial, sans-serif');
          t.textContent = f.label || f.name;
          gLab.appendChild(t);
        });
        districts.forEach(f => {
          const path = document.createElementNS(svg.namespaceURI, 'path');
          const isFocus = !selected || selected === f.name;
          path.setAttribute('d', proj.path(f.rings));
          path.setAttribute('fill', fillForDistrict(f.name, mode, panel, selected));
          path.setAttribute('fill-opacity', isFocus ? (selected ? '0.92' : '0.55') : '0.22');
          path.setAttribute('stroke', isFocus ? '#4d7363' : MASK_STROKE);
          path.setAttribute('stroke-width', selected === f.name ? '1.6' : '0.7');
          path.style.cursor = 'pointer';
          path.addEventListener('click', e => {
            e.stopPropagation();
            setSharedSelected(f.name);
          });
          gPoly.appendChild(path);
        });
      } else {
        districts.forEach(f => {
          const path = document.createElementNS(svg.namespaceURI, 'path');
          const isFocus = !selected || selected === f.name;
          path.setAttribute('d', proj.path(f.rings));
          path.setAttribute('fill', fillForDistrict(f.name, mode, panel, selected));
          path.setAttribute('fill-opacity', isFocus ? (selected ? '0.95' : '0.78') : '0.18');
          path.setAttribute('stroke', isFocus ? '#4d7363' : MASK_STROKE);
          path.setAttribute('stroke-width', selected === f.name ? '2.2' : (isFocus ? '0.9' : '0.55'));
          path.style.cursor = 'pointer';
          path.addEventListener('click', e => {
            e.stopPropagation();
            setSharedSelected(f.name);
          });
          path.addEventListener('mouseenter', () => {
            const n = (panel.counts && panel.counts[f.name]) || POINTS.filter(p => p.district === f.name).length;
            status.textContent = `${f.name}: ${n.toLocaleString()} plots` +
              (selected === f.name ? ' · focused (others greyed)' : ' · click to focus');
          });
          gPoly.appendChild(path);

          const [cx, cy] = proj.xy(f.centroid[0], f.centroid[1]);
          const t = document.createElementNS(svg.namespaceURI, 'text');
          t.setAttribute('x', cx); t.setAttribute('y', cy);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'middle');
          t.setAttribute('font-size', isFocus ? '12' : '10');
          t.setAttribute('font-weight', isFocus ? '650' : '500');
          t.setAttribute('fill', isFocus ? '#2f2c28' : MASK_STROKE);
          t.setAttribute('fill-opacity', isFocus ? '1' : '0.55');
          t.setAttribute('font-family', 'Segoe UI, Helvetica Neue, Arial, sans-serif');
          t.style.pointerEvents = 'none';
          t.textContent = f.name;
          gLab.appendChild(t);
        });
      }

      // Keep all points for context; grey out points outside the focused district.
      const order = POINTS.slice().sort((a, b) => {
        const aFocus = !selected || a.district === selected;
        const bFocus = !selected || b.district === selected;
        if (aFocus !== bFocus) return aFocus ? 1 : -1;
        if (mode === 'weak' || mode === 'dup' || mode === 'outside') {
          if (a[mode] !== b[mode]) return a[mode] ? 1 : -1;
        }
        return 0;
      });

      order.forEach(pt => {
        const [x, y] = proj.xy(pt.lon, pt.lat);
        const c = document.createElementNS(svg.namespaceURI, 'circle');
        const inFocus = !selected || pt.district === selected;
        const hot = inFocus && (
          (mode === 'weak' && pt.weak) ||
          (mode === 'dup' && pt.dup) ||
          (mode === 'outside' && pt.outside)
        );
        c.setAttribute('cx', x.toFixed(1));
        c.setAttribute('cy', y.toFixed(1));
        c.setAttribute('r', hot ? 3.2 : (inFocus ? 2.2 : 1.5));
        c.setAttribute('fill', colorFor(pt, mode, selected));
        c.setAttribute(
          'fill-opacity',
          inFocus
            ? (hot || mode === 'district' || mode === 'land' || mode === 'count' ? 0.9 : 0.4)
            : 0.12
        );
        c.setAttribute('stroke', inFocus ? '#fffcf7' : 'none');
        c.setAttribute('stroke-width', inFocus ? '0.4' : '0');
        c.style.cursor = 'pointer';
        c.addEventListener('mouseenter', () => {
          tip.style.display = 'block';
          tip.innerHTML = tipHtml(pt);
          status.textContent = `${pt.district} · ${pt.land}`;
        });
        c.addEventListener('mousemove', ev => {
          const rect = stage.getBoundingClientRect();
          tip.style.left = Math.min(rect.width - 220, Math.max(8, ev.clientX - rect.left + 12)) + 'px';
          tip.style.top = Math.min(rect.height - 90, Math.max(8, ev.clientY - rect.top + 12)) + 'px';
        });
        c.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
        c.addEventListener('click', e => {
          e.stopPropagation();
          setSharedSelected(pt.district);
        });
        gPts.appendChild(c);
      });

      svg.appendChild(gPoly);
      svg.appendChild(gPts);
      svg.appendChild(gLab);

      const focused = selected ? POINTS.filter(p => p.district === selected) : POINTS;
      const nHot = mode === 'weak' ? focused.filter(p => p.weak).length
        : mode === 'dup' ? focused.filter(p => p.dup).length
        : mode === 'outside' ? focused.filter(p => p.outside).length
        : focused.length;
      status.textContent = selected
        ? `${selected} in focus · ${focused.length.toLocaleString()} plots · other districts greyed · click again or Reset view to clear`
        : `Showing ${POINTS.length.toLocaleString()} points` +
          (mode === 'weak' || mode === 'dup' || mode === 'outside' ? ` · ${nHot} highlighted` : '') +
          ' · scroll to zoom · drag to pan · click a district to focus';
      renderLegend(legend, mode);
    }

    redrawers.push(draw);
    draw(true);
  });
}

const PALETTE = ['#7a9bb5','#6d9b86','#d7b58a','#b39bc4','#d09b9b','#87c0b6','#d4c48c','#a9b7c7','#c9a7b0','#8eae8c'];
Chart.defaults.font.family = "'Segoe UI','Helvetica Neue',Arial,sans-serif";
Chart.defaults.color = '#4a453f';
Chart.defaults.plugins.legend.labels.boxWidth = 12;
Chart.defaults.plugins.legend.labels.font = { size: 11 };

let currentDistrict = '__ALL__';
const charts = {};

function destroy(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
function fmt(v, unit) {
  if (v === null || v === undefined || Number.isNaN(v)) return '';
  const n = Number(v);
  if (unit === 'pct') return n.toFixed(1) + '%';
  if (Number.isInteger(n)) return n.toLocaleString();
  return n.toFixed(1);
}
function entriesOf(obj) {
  return Object.entries(obj || {}).filter(([,v]) => v !== null && v !== undefined);
}
function activeData(spec) {
  if (currentDistrict !== '__ALL__' && spec.by_district && spec.by_district[currentDistrict]) {
    const d = spec.by_district[currentDistrict];
    // hazards-style: still a label->number map
    if (d && typeof Object.values(d)[0] !== 'object') return d;
  }
  return spec.overall;
}

function makePie(id, obj, unit) {
  destroy(id);
  const el = document.getElementById(id);
  if (!el) return;
  const ents = entriesOf(obj).sort((a,b)=>b[1]-a[1]);
  charts[id] = new Chart(el, {
    type: 'doughnut',
    data: {
      labels: ents.map(e => e[0]),
      datasets: [{ data: ents.map(e => e[1]), backgroundColor: PALETTE, borderWidth: 2, borderColor: '#fffcf7' }]
    },
    options: {
      cutout: '52%',
      plugins: {
        legend: { position: 'bottom' },
        datalabels: {
          color: '#3e3a35', font: { size: 10, weight: '600' },
          formatter: (v) => v ? fmt(v, unit || 'pct') : ''
        }
      }
    }
  });
}
function makeBar(id, obj, horizontal, unit) {
  destroy(id);
  const el = document.getElementById(id);
  if (!el) return;
  let ents = entriesOf(obj);
  if (horizontal) ents = ents.sort((a,b)=>a[1]-b[1]);
  charts[id] = new Chart(el, {
    type: 'bar',
    data: {
      labels: ents.map(e => e[0]),
      datasets: [{ data: ents.map(e => e[1]), backgroundColor: horizontal ? '#6d9b86' : '#7a9bb5', borderRadius: 5 }]
    },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      plugins: {
        legend: { display: false },
        datalabels: {
          anchor: 'end', align: horizontal ? 'right' : 'top',
          color: '#5c574f', font: { size: 10, weight: '600' },
          formatter: (v) => fmt(v, unit)
        }
      },
      scales: {
        x: { beginAtZero: true, grid: { color: '#eee8dc' } },
        y: { beginAtZero: true, grid: { color: '#eee8dc' } }
      }
    }
  });
}
function makeGrouped(id, extra) {
  destroy(id);
  const el = document.getElementById(id);
  if (!el || !extra) return;
  const datasets = (extra.datasets || []).map((ds, i) => ({
    ...ds,
    backgroundColor: PALETTE[i % PALETTE.length],
    borderRadius: 4
  }));
  charts[id] = new Chart(el, {
    type: 'bar',
    data: { labels: extra.labels || [], datasets },
    options: {
      plugins: { legend: { position: 'bottom' }, datalabels: { display: false } },
      scales: { x: { beginAtZero: true, grid: { color: '#eee8dc' } }, y: { beginAtZero: true, grid: { color: '#eee8dc' } } }
    }
  });
}

function renderChart(spec) {
  const id = 'c-' + spec.id;
  if (spec.type === 'grouped') { makeGrouped(id, spec.extra); return; }
  const data = activeData(spec);
  const nar = document.getElementById('n-' + spec.id);
  if (nar) {
    let t = spec.narrative || '';
    if (currentDistrict !== '__ALL__' && spec.by_district && spec.by_district[currentDistrict] && spec.type !== 'grouped') {
      const d = spec.by_district[currentDistrict];
      const top = entriesOf(d).sort((a,b)=>b[1]-a[1])[0];
      if (top) t = 'In ' + currentDistrict + ': ' + top[0] + ' is ' + fmt(top[1], spec.unit || 'pct') + '. ' + t;
    }
    nar.textContent = t;
  }
  if (spec.type === 'pie') makePie(id, data, spec.unit);
  else if (spec.type === 'barh') makeBar(id, data, true, spec.unit);
  else makeBar(id, data, false, spec.unit);
}

function renderAll() {
  Object.values(DATA.charts).forEach(renderChart);
}

function buildPage() {
  const toc = document.getElementById('toc');
  const chartSecs = new Set(Object.values(DATA.charts).map(c => c.section));
  toc.innerHTML = DATA.sections
    .filter(s => chartSecs.has(s.id))
    .map(s => `<a href="#sec-${s.id}">${s.nav || s.title}</a>`).join('');

  const host = document.getElementById('app');
  const s = DATA.summary;
  const funnel = [
    ['Submissions', s.n_raw, 'All received'],
    ['Consented', s.n_consented, (s.consent_pct ?? '') + '% of submissions'],
    ['Farmed land', s.n_post, 'Agricultural, fallow or pasture'],
    ['Non-agricultural land', s.n_nonag, 'Interview ends after land use']
  ].map(([l,v,h]) => `<div class="funnel-step"><div class="v">${(v??'—').toLocaleString?.() ?? v}</div><div class="l">${l}</div><div class="l">${h}</div></div>`).join('');

  const kpis = DATA.kpis.map(k => {
    const val = typeof k.value === 'number' ? k.value.toLocaleString() : (k.value ?? '—');
    return `<div class="kpi"><div class="v">${val}</div><div class="l">${k.label}</div><div class="h">${k.hint||''}</div></div>`;
  }).join('');
  const opening = (DATA.opening || []).map(p => `<p>${p}</p>`).join('');
  const districtBtns = DATA.districts.map(d => `<button class="pill" data-d="${d}">${d}</button>`).join('');
  const qaRows = (DATA.qa_checks || []).map(r =>
    `<tr><td>${r.item||''}</td><td>${r.n ?? '—'}</td><td>${r.note||''}</td></tr>`
  ).join('');

  let html = '';
  html += `<div class="story"><h2>Rwanda Data Collection Season B</h2>${opening}</div>`;
  html += `<div class="funnel">${funnel}</div>`;
  html += `<div class="kpis">${kpis}</div>`;
  if (qaRows) {
    html += `<!-- <div class="card wide" style="margin:1rem 0 1.2rem"><h3>Data checks</h3>
      <p class="nar">Records that need a look. They are still included in the charts below.</p>
      <table class="cov"><thead><tr><th>Check</th><th>Count</th><th>Note</th></tr></thead>
      <tbody>${qaRows}</tbody></table></div>-->`;
  }
  html += `<!--<p class="note">Land use splits the sample. Non-agricultural plots end after that question.
  Farmer, crop and land-management results describe <strong>agricultural land, fallow and pasture</strong> only.
  Crop and fertilizer charts count <em>observations</em> (one row per plot × crop or fertilizer).
  Multi-select bars are <strong>% of farmed plots</strong> and do not sum to 100%.
  Each chart caption shows how many applicable records answered, and the percentage shares.</p>-->`;
  html += `<div class="filter-bar"><span class="lbl">District</span>
    <button class="pill active" data-d="__ALL__">All districts</button>${districtBtns}
    <span class="lbl" id="filter-hint">All districts. Practice charts use farmed plots (agricultural land, fallow, pasture) unless a caption says otherwise.</span>
  </div>`;

  const bySec = {};
  Object.values(DATA.charts).forEach(c => {
    (bySec[c.section] = bySec[c.section] || []).push(c);
  });
  DATA.sections.forEach(sec => {
    const list = bySec[sec.id] || [];
    if (!list.length && sec.id !== 'overview') return;
    html += `<section class="block" id="sec-${sec.id}"><h2>${sec.title}</h2>`;
    if (sec.lead) html += `<p class="section-lead">${sec.lead}</p>`;
    if (sec.id === 'overview' && DATA.maps && DATA.maps.panels && DATA.maps.panels.length) {
      DATA.maps.panels.forEach(m => {
        html += `<div class="card wide map-card"><h3>${m.title}</h3>
          <p class="nar">${m.caption}</p>
          <div class="imap" data-imap="${m.id}"></div></div>`;
      });
    }
    if (list.length) {
      html += `<div class="grid">`;
      list.forEach(c => {
        html += `<article class="card${c.wide ? ' wide' : ''}"><h3>${c.title}</h3>
          <p class="nar" id="n-${c.id}"></p><canvas id="c-${c.id}"></canvas></article>`;
      });
      html += `</div>`;
    }
    html += `</section>`;
  });

  host.innerHTML = html;

  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDistrict = btn.dataset.d;
      const hint = document.getElementById('filter-hint');
      hint.textContent = currentDistrict === '__ALL__'
        ? 'All districts. Practice charts use farmed plots (agricultural land, fallow, pasture) unless a caption says otherwise.'
        : 'Highlighting ' + currentDistrict + ' on charts that have a district breakdown. Comparison charts stay provincial.';
      renderAll();
    });
  });
  renderAll();
}

buildPage();
initInteractiveMaps(DATA.maps);
</script>
</body>
</html>
